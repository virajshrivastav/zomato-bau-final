<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Zomato BAU Dashboard</title>
    <meta name="description" content="Key Account Manager Dashboard for Zomato Drive campaigns" />
    <meta name="author" content="Zomato" />
    <!-- Metropolis font loaded via @font-face in index.css -->

    <meta property="og:title" content="Zomato Drive Dashboard" />
    <meta
      property="og:description"
      content="Key Account Manager Dashboard for Zomato Drive campaigns"
    />
    <meta property="og:type" content="website" />

    <!-- Prevent flash of unstyled content (FOUC) for dark mode -->
    <script>
      try {
        const theme = localStorage.getItem('zomato-dashboard-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
